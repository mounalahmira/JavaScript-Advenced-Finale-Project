<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="./output.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>

</head>
<body>

<!-- ALERT -->
<div
    id="loginAlert"
    role="alert"
    class="hidden fixed top-4 right-4 z-[60] max-w-sm
           items-start gap-3 rounded border bg-white
           p-3 text-sm shadow-lg"
>
    <div>
        <h3 id="alertTitle" class="font-medium text-slate-700">
            Alert title
        </h3>

        <p id="alertMessage" class="text-slate-500">
            Alert message
        </p>
    </div>

    <button
        id="closeAlert"
        type="button"
        aria-label="Close alert"
        class="mb-auto cursor-pointer text-2xl leading-5
               text-slate-400 transition hover:text-slate-600
               active:scale-95"
    >
        &times;
    </button>
</div>
<!-- END ALERT -->


<!-- Button that opens the modal -->
 <div class="flex w-80 justify-around">
    <button
        class="openLogin bg-indigo-500 hover:bg-indigo-600 text-white px-5 py-2 rounded-lg"
    >
        Login
    </button>
    <button
        class="openLogin bg-indigo-500 hover:bg-indigo-600 text-white px-5 py-2 rounded-lg"
    >
        Register
    </button>
 </div>


<!-- Modal backdrop -->
<div
    id="loginModal"
    class="hidden fixed inset-0 z-50 flex items-center justify-center
           bg-black/50 p-4"
>
    <!-- Modal content -->
    <div
        id="loginContent"
        class="relative w-full max-w-96 rounded-lg bg-white p-6
               text-left text-sm text-gray-500 shadow-lg"
    >
        <!-- Close button -->
        <button
            id="closeLogin"
            type="button"
            aria-label="Close login"
            class="absolute right-4 top-3 text-2xl text-gray-500
                   hover:text-gray-800"
        >
            &times;
        </button>

        <h2 class="mb-6 text-center text-2xl font-semibold text-gray-800">
            Login
        </h2>

        
            <label for="username">Username</label>
            <input
                id="username"
                name="username"
                type="text"
                placeholder="Enter your username"
                required
                class="mt-1 w-full rounded border border-gray-500/30
                       p-2 outline-none focus:border-indigo-500"
            >

            <label for="password" class="mt-3 block">Password</label>
            <input
                id="password"
                name="password"
                type="password"
                placeholder="Your password"
                required
                class="mt-1 w-full rounded border border-gray-500/30
                       p-2 outline-none focus:border-indigo-500"
            >

            <button
                onclick="login()"
                class="my-4 w-full rounded bg-indigo-500 py-2.5
                       text-white transition hover:bg-indigo-600
                       active:scale-95"
            >
                Login
            </button>
        
    </div>
</div>



    <script>
        
const openButton = document.querySelector(".openLogin");
const closeButton = document.querySelector("#closeLogin");
const modal = document.querySelector("#loginModal");
const modalContent = document.querySelector("#loginContent");
// const loginForm = document.querySelector("#loginForm");

// Open the modal
openButton.addEventListener("click", () => {
    modal.classList.remove("hidden");
});

// Close the modal using the X button
closeButton.addEventListener("click", () => {
    modal.classList.add("hidden");
});

// Close when clicking outside the form
modal.addEventListener("click", (event) => {
    if (!modalContent.contains(event.target)) {
        modal.classList.add("hidden");
    }
});

// Close when pressing Escape
document.addEventListener("keydown", (event) => {
    if (event.key === "Escape") {
        modal.classList.add("hidden");
    }
});




const alertBox = document.querySelector("#loginAlert");
const alertTitle = document.querySelector("#alertTitle");
const alertMessage = document.querySelector("#alertMessage");
const closeAlert = document.querySelector("#closeAlert");

// Store the timer so we can reset it when another alert appears
let alertTimeout;

// Colors for each alert type
const alertStyles = {
    success: [
        "border-green-400",
        "bg-green-50",
        "text-green-700"
    ],
    error: [
        "border-red-400",
        "bg-red-50",
        "text-red-700"
    ],
    warning: [
        "border-yellow-400",
        "bg-yellow-50",
        "text-yellow-700"
    ]
};

// Reusable alert function
function showAlert(title, message, type) {

    // Update the title and message
    alertTitle.textContent = title;
    alertMessage.textContent = message;

    // Remove the previous alert colors
    Object.values(alertStyles).flat().forEach(className => {
        alertBox.classList.remove(className);
        alertTitle.classList.remove(className);
    });

    // Apply the colors for the selected type
    const colors = alertStyles[type] || alertStyles.success;

    alertBox.classList.add(colors[0], colors[1]);
    alertTitle.classList.add(colors[2]);

    // Show the alert
    alertBox.classList.remove("hidden");
    alertBox.classList.add("flex");

    // Cancel the previous timer, if there is one
    clearTimeout(alertTimeout);

    // Hide the alert after 3 seconds
    alertTimeout = setTimeout(() => {
        hideAlert();
    }, 3000);
}

// Function to hide the alert
function hideAlert() {
    alertBox.classList.add("hidden");
    alertBox.classList.remove("flex");

    clearTimeout(alertTimeout);
}

// Close the alert when clicking X
closeAlert.addEventListener("click", hideAlert);



const baseUrl = "https://tarmeezacademy.com/api/v1";

function login() {
    const username = document.getElementById("username").value;
    const password = document.getElementById("password").value;

    const params = {
        username: username,
        password: password
    };

    const url = `${baseUrl}/login`;

    axios.post(url, params)
        .then((response) => {
            console.log(response.data);

            // Close the login modal
            modal.classList.add("hidden");

            // Show success alert
            showAlert(
                "Login Successful",
                "Welcome to our community!",
                "success"
            );
        })
        .catch((error) => {
            console.error(error);

            // Show error alert
            showAlert(
                "Login Failed",
                "Please check your username and password.",
                "error"
            );
        });
}

    </script>
</body>
</html>
